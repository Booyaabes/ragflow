name: quick-ci

# Lightweight checks that run on stock GitHub-hosted ubuntu-latest runners,
# unlike sep-tests.yml/release.yml/serenedb.yml which require Infiniflow's
# self-hosted ragflow-test/ragflow-release runners and pre-seeded native
# libs/testdata. This workflow covers: Go build + unit tests, and frontend lint.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quick-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go build + unit tests
    runs-on: ubuntu-latest
    env:
      # onnxruntime_go is an org mirror that is not in the public Go checksum
      # database, so Go must resolve it directly from GitHub.
      GOPRIVATE: github.com/infiniflow/onnxruntime_go
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v3

      - name: Install native build toolchain (clang-20, lld-20, pcre2)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev clang-20 lld-20
          sudo ln -sf /usr/bin/clang++-20 /usr/bin/clang++
          sudo ln -sf /usr/bin/clang-20 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-20 /usr/bin/ld.lld

      # internal/binding/cpp/CMakeLists.txt requires CMake >= 4.0; ubuntu-latest
      # ships 3.x. The `cmake` PyPI wheel tracks current upstream releases.
      - name: Install CMake >= 4.0
        run: pip install "cmake>=4.0"

      - name: Cache native static libs and dev resources
        uses: actions/cache@v4
        with:
          path: |
            ~/ragflow-native-libs
            deps
          key: ragflow-dev-deps-${{ hashFiles('tools/scripts/download_dev_deps.py', 'go.mod') }}

      # Native static libs (pdfium/pdf_oxide/office_oxide/onnxruntime) plus the
      # cl100k BPE table and tokenizer assets the unit tests read from deps/.
      - name: Download Go dev deps
        run: uv run tools/scripts/download_dev_deps.py

      # `--test` does not build the C++ tokenizer static library that CGO links
      # against; build it with the toolchain installed above.
      - name: Build C++ static library
        run: bash build.sh --cpp

      - name: Run Go unit tests
        run: bash build.sh --test ./...

  frontend-test:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint
