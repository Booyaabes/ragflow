name: docker-ghcr

# Builds the production Docker image (root Dockerfile) and pushes it to this
# repo's GitHub Container Registry — unlike release.yml, which builds the same
# image but pushes it to Docker Hub (infiniflow/ragflow), not GHCR.
#
# Not wired to pull_request: the image is multi-GB and pushing on every PR
# would be wasteful, and PR builds should not have write access to the
# registry. Trigger manually or push/tag on main instead.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The build compiles the Go server against native static libs and pulls
      # runtime resources from infiniflow/ragflow_deps:latest; the build cache
      # and image are several GB and ubuntu-latest's ~14GB free disk is tight.
      # Clear preinstalled toolchains we don't use (Android SDK, .NET, Haskell)
      # before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase owner/repo path; github.repository preserves
      # case (e.g. Booyaabes/ragflow).
      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile's default Go proxy (goproxy.cn) is flaky from
          # GitHub-hosted runners; release.yml overrides it the same way.
          build-args: |
            NEED_MIRROR=0
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
